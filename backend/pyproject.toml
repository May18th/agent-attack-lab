[project]
name = "agent-attack-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "3498414260", email = "3498414260@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    # Keep the CI/test baseline installable from the public package index.
    # Production Wutong 2.2.0 + wit-framework are installed separately by
    # scripts/install_wit_wheels.ps1 from the private release directory.
    "acps-sdk>=2.1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pymysql>=1.1",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "PyJWT[crypto]>=2.8",
    "pytest>=8.0",
    "uvicorn>=0.29",
    "redis>=5.0,<7.0",
    # AMP heartbeat 直投平台 Kafka（wt.ioa.pub:19092）。纯 Python，无需编译。
    # 未安装时 amp.py 自动退化为只写本地 NDJSON，由 Fluent Bit 转发。
    "kafka-python>=3.0",
    "reportlab>=5.1.0",
]

# Production Wutong wheels are intentionally not a repository dependency:
# they are private release artifacts and are installed after platform approval.
# The code supports both the public SDK 2.1 interface and the locked 2.2 API.

[project.scripts]
agent-attack-lab = "agent_attack_lab:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.0,<3",
    "ruff>=0.17.2",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares Query/Depends as parameter defaults by design, so B008
# would fire on nearly every route; an inline noqa breaks as soon as the
# formatter re-wraps the call, so ignore it for the router module instead.
"src/agent_attack_lab/service.py" = ["B008"]
"src/agent_attack_lab/routers/*.py" = ["B008"]

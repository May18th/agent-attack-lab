[project]
name = "agent-attack-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "3498414260", email = "3498414260@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "acps-sdk>=2.2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pymysql>=1.1",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "pytest>=8.0",
    "uvicorn>=0.29",
]

# 梧桐官方 wheel 不在公共 PyPI：acps-sdk 2.2.0 必须来自 backend/packages/
# 下的官方 wheel（见 scripts/install_wit_wheels.ps1 与 docs/WUTONG_WHEEL_SETUP.md）。
# 固定为本地源后，uv sync / uv run 不会再把 venv 静默回滚到 PyPI 的 2.1.0
# （2.1.0 的 handle_rpc_request 不支持 local_aic / identity_binding_enabled 参数，
# 会导致 6 项测试失败且 /rpc AIP 接口 500）。
# 注意：packages/ 不入 Git，新环境先放置 wheel 再 uv sync。
[tool.uv.sources]
acps-sdk = { path = "packages/acps_sdk-2.2.0-py3-none-any.whl" }

[project.scripts]
agent-attack-lab = "agent_attack_lab:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

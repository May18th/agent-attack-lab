name: 诊断 AMP 心跳

# 仅在 VPS 的 self-hosted runner 上手动触发，用于排查「生产心跳是否真的发出」。
# 只读诊断 + 一次自身 AIC 的心跳投递测试，不修改任何配置。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: 诊断生产心跳
    runs-on: [self-hosted, production]
    timeout-minutes: 10
    steps:
      - name: 环境与身份文件
        shell: bash
        run: |
          set -uo pipefail
          echo "== whoami =="; id
          echo "== 部署目录 =="; ls -ld /opt/agent-attack-lab/backend || true
          readlink -f /opt/agent-attack-lab/backend || true
          echo "== 身份文件 =="
          ls -l /opt/agent-attack-lab/backend/agent-identities.json || echo "MISSING_IDENTITIES"
          echo "== AMP 相关环境（值脱敏） =="
          grep -E '^AGENT_(AMP|LLM)' /opt/agent-attack-lab/backend/.env 2>/dev/null \
            | sed -E 's/(API_KEY=).*/\1<redacted>/' || echo "NO_ENV_KEYS"
          echo "== systemd 单元 =="
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user is-active agent-attack-lab-api.service agent-attack-lab-attacker.service agent-attack-lab-defender.service || true

      - name: 解析角色到 AIC
        shell: bash
        run: |
          set -uo pipefail
          cd /opt/agent-attack-lab/backend
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          ./.venv/bin/python - <<'PY' || true
          import os
          from agent_attack_lab import amp
          print("identities_file =", amp._identity_file())
          print("存在 =", amp._identity_file().exists())
          print("映射 =", amp.load_identities())
          for role in ("leader", "attacker", "defender"):
              os.environ["AGENT_AMP_ROLE"] = role
              print(role, "->", amp.resolve_identity())
          print("kafka 可用 =", __import__("importlib").util.find_spec("kafka") is not None)
          PY

      - name: 出口连通性
        shell: bash
        run: |
          set -uo pipefail
          echo "== DNS =="; getent hosts wt.ioa.pub || true
          echo "== TCP 19092 =="
          timeout 8 bash -c 'cat < /dev/null > /dev/tcp/wt.ioa.pub/19092' && echo "19092 OPEN" || echo "19092 BLOCKED"

      - name: 服务日志中的心跳线索
        shell: bash
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for svc in agent-attack-lab-api agent-attack-lab-attacker agent-attack-lab-defender; do
            echo "===== $svc ====="
            journalctl --user -u "$svc" --since "-20min" --no-pager 2>/dev/null \
              | grep -iE "amp|心跳|kafka|心跳启动|warning" | tail -15 || echo "(无相关日志)"
          done

      - name: 端到端投递一次心跳
        shell: bash
        run: |
          set -uo pipefail
          cd /opt/agent-attack-lab/backend
          # 与 start-service.sh 同样的方式载入 .env，再由脚本覆盖角色
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue
            if [[ "$line" =~ ^(AGENT_[A-Z0-9_]+)=(.*)$ ]]; then
              export "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}"
            fi
          done < .env
          export AGENT_AMP_ENABLED=1
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          ./.venv/bin/python - <<'PY' || true
          import asyncio
          import os
          from agent_attack_lab import amp

          async def one(role):
              os.environ["AGENT_AMP_ROLE"] = role
              hb = amp.AmpHeartbeat.from_env()
              if hb is None:
                  print(role, "-> 无法装配（身份解析失败或未开启）")
                  return
              record = await hb.emit_once()
              print(role, "-> 已投递 aic =", record["aic"], "| stats =", hb.stats)
              await hb.stop()

          async def main():
              for role in ("leader", "attacker", "defender"):
                  try:
                      await one(role)
                  except Exception as exc:
                      print(role, "-> 异常:", type(exc).__name__, exc)

          asyncio.run(main())
          PY

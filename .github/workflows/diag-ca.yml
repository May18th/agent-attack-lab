name: 查 mTLS 客户端 CA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ca:
    runs-on: [self-hosted, production]
    timeout-minutes: 6
    steps:
      - name: 检查三个入口的 ssl_client_certificate
        shell: bash
        run: |
          set -uo pipefail
          base=/home/deployer/.config/agent-attack-lab/partners

          echo "===== nginx 里三个 server 的 ssl_client_certificate ====="
          sudo -n grep -E "server_name|ssl_client_certificate" /etc/nginx/sites-enabled/*.conf 2>/dev/null | sed 's/^\s*//' || true

          echo
          for role in attack defender leader; do
            f="$base/$role/workspace/acps/ca-verify.pem"
            echo "===== $role : $f ====="
            if sudo -n test -r "$f"; then
              echo "  证书张数 = $(sudo -n grep -c 'BEGIN CERTIFICATE' "$f" 2>/dev/null)"
              sudo -n openssl crl2pkcs7 -nocrl -certfile "$f" 2>/dev/null \
                | sudo -n openssl pkcs7 -print_certs -noout 2>/dev/null \
                | grep -E "subject|issuer" | sed 's/^/  /' || echo "  (解析失败)"
            else
              echo "  不存在或不可读"
            fi
            echo
          done

          echo "===== 对比：完整 trust-bundle 有几张 ====="
          for role in attack defender leader; do
            f="$base/$role/workspace/acps/trust-bundle.pem"
            if sudo -n test -r "$f"; then
              echo "  $role trust-bundle = $(sudo -n grep -c 'BEGIN CERTIFICATE' "$f") 张"
            else
              echo "  $role trust-bundle 不存在"
            fi
          done

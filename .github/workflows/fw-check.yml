name: 查 443 入口拦截策略

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fw:
    runs-on: [self-hosted, production]
    timeout-minutes: 6
    steps:
      - name: 防火墙规则
        shell: bash
        run: |
          set -uo pipefail
          echo "===== iptables INPUT（前 30 条，含计数器） ====="
          sudo -n iptables -L INPUT -n -v --line-numbers 2>&1 | head -30 || echo "  (读不到)"

          echo
          echo "===== iptables 中含 443 的规则 ====="
          sudo -n iptables-save 2>/dev/null | grep -E "443|REJECT|DROP" | head -25 || echo "  (无)"

          echo
          echo "===== nftables ====="
          sudo -n nft list ruleset 2>/dev/null | head -25 || echo "  (nft 未使用)"

          echo
          echo "===== firewalld ====="
          sudo -n firewall-cmd --list-all 2>/dev/null || echo "  (firewalld 未安装)"

          echo
          echo "===== 443 监听 ====="
          ss -lntp 2>/dev/null | grep ":443\|:80 " || echo "  (无)"

      - name: nginx TLS 策略
        shell: bash
        run: |
          set -uo pipefail
          echo "===== 是否有 SNI 拒绝 / 地址限制 ====="
          sudo -n nginx -T 2>/dev/null | grep -nE "ssl_reject_handshake|allow |deny |ssl_protocols|ssl_ciphers|ssl_verify_client|listen " | head -25 || true

          echo
          echo "===== 三个 server 的 allow/deny 指令 ====="
          sudo -n grep -rnE "allow |deny " /etc/nginx/ 2>/dev/null | head -10 || echo "  (无 allow/deny)"

      - name: 阿里云侧线索
        shell: bash
        run: |
          set -uo pipefail
          echo "===== 是否有阿里云安全组件 ====="
          ps -ef 2>/dev/null | grep -iE "[a]liyun|[a]gs|[c]loudfw|[y]undun" | head -8 || echo "  无相关进程"

          echo
          echo "===== 内核丢包计数 ====="
          ss -s 2>/dev/null | head -8
          echo "--- netstat 重传/丢弃 ---"
          netstat -s 2>/dev/null | grep -iE "reset|drop|reject" | head -10 || true

name: 抓包核对平台入站

# 只读：在 VPS 上抓 120 秒 TCP/TLS 入站包，用于核对平台调用是否真的到达服务器。
# 不修改任何服务、不写业务文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: tcpdump 120s
    runs-on: [self-hosted, production]
    timeout-minutes: 8
    steps:
      - name: 抓包
        shell: bash
        run: |
          set -uo pipefail
          echo "== 开始时 access.log 行数 =="
          sudo -n wc -l /var/log/nginx/access.log 2>/dev/null || true
          echo "== 抓包 120s（只看 443 与 8443 端口的 SYN / ClientHello 方向） =="
          sudo -n timeout 120 tcpdump -i any -nn -c 200 \
            'tcp port 443 or tcp port 8443' 2>&1 | tail -60 || echo "TCPDUMP_END"
          echo "== 结束时 access.log 行数 =="
          sudo -n wc -l /var/log/nginx/access.log 2>/dev/null || true
          echo "== 期间 error.log 大小 =="
          sudo -n stat -c '%s %y' /var/log/nginx/error.log 2>/dev/null || true

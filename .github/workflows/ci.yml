name: 项目检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check sensitive files
        run: python scripts/check_sensitive_files.py
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Setup Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked
      - name: Install CJK font for PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: 前端构建与检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontend-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

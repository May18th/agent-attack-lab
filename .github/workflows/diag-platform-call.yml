name: 平台调用现场取证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grab:
    runs-on: [self-hosted, production]
    timeout-minutes: 8
    steps:
      - name: 取证
        shell: bash
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          echo "===== A. /rpc 完整访问行（最近 40 条） ====="
          sudo -n grep "/rpc" /var/log/nginx/access.log 2>/dev/null | tail -40 || echo "(grep 失败)"

          echo
          echo "===== B. 按 IP + 状态码 + UA 聚合 ====="
          sudo -n grep "/rpc" /var/log/nginx/access.log 2>/dev/null \
            | awk '{print $1, $9, $12, $13, $14}' | sort | uniq -c | sort -rn | head -20 || true

          echo
          echo "===== C. 非本机探测的 /rpc 请求（排除 127.0.0.1/内网） ====="
          sudo -n grep "/rpc" /var/log/nginx/access.log 2>/dev/null \
            | grep -vE "^(127\.0\.0\.1|172\.|10\.|192\.168\.)" | tail -20 || echo "(全部来自本机)"

          echo
          echo "===== D. leader(8787) 的 AMP 心跳状态 ====="
          journalctl --user -u agent-attack-lab-api --since "-3h" --no-pager 2>/dev/null \
            | grep -iE "amp|heartbeat|心跳" | tail -10 || echo "(leader 无 AMP 日志)"

          echo
          echo "===== E. 各服务 AMP 相关环境变量（只看有无/取值） ====="
          for port in 8787 8788 8789; do
            pid=$(ss -lntp 2>/dev/null | grep ":$port " | grep -oP 'pid=\K[0-9]+' | head -1)
            echo "-- 127.0.0.1:$port pid=$pid --"
            if [ -n "${pid:-}" ]; then
              tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null \
                | grep -E '^AGENT_(AMP|AIP|LOCAL|IDENTITY|ROLE)' | sed -E 's/(KEY|SECRET|TOKEN)=.*/\1=***/' || echo "  (无)"
            fi
          done

          echo
          echo "===== F. 近 3h 三个服务的所有 4xx/5xx 请求日志 ====="
          journalctl --user -u agent-attack-lab-api -u agent-attack-lab-attacker -u agent-attack-lab-defender \
            --since "-3h" --no-pager 2>/dev/null | grep -E '"(GET|POST)' | tail -40 || echo "(无)"

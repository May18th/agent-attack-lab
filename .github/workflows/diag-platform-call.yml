name: 平台调用现场取证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grab:
    runs-on: [self-hosted, production]
    timeout-minutes: 8
    steps:
      - name: 取证
        shell: bash
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          echo "===== A. 主调度(8787) 本次启动完整日志（前 40 行） ====="
          journalctl --user -u agent-attack-lab-api --since "-3h" --no-pager 2>/dev/null | head -40 || echo "(无)"

          echo
          echo "===== B. 主调度日志里的 AMP / AIC / warning 全量 ====="
          journalctl --user -u agent-attack-lab-api --since "-6h" --no-pager 2>/dev/null \
            | grep -iE "amp|aic|identit|心跳|warning|warn" | tail -20 || echo "(无)"

          echo
          echo "===== C. 身份文件与心跳投递记录 ====="
          sudo -n find /home/deployer /opt/agent-attack-lab -maxdepth 6 -name "agent-identities.json" 2>/dev/null | head -5
          echo "-- 最近心跳 JSONL（各 role） --"
          sudo -n find /home/deployer /opt/agent-attack-lab -maxdepth 8 -name "amp_heartbeat_*.jsonl" 2>/dev/null | while read -r f; do
            echo "  $f  lines=$(sudo -n wc -l < "$f" 2>/dev/null)  last=$(sudo -n tail -1 "$f" 2>/dev/null | cut -c1-160)"
          done

          echo
          echo "===== D. Kafka 出口连通性（AMP 投递目标） ====="
          timeout 8 bash -c 'cat < /dev/null > /dev/tcp/wt.ioa.pub/19092' 2>&1 && echo "  wt.ioa.pub:19092 TCP OK" || echo "  wt.ioa.pub:19092 TCP FAIL"

          echo
          echo "===== E. 三个服务最近一条心跳/错误 ====="
          for svc in agent-attack-lab-api agent-attack-lab-attacker agent-attack-lab-defender; do
            echo "-- $svc --"
            journalctl --user -u "$svc" --since "-30min" --no-pager 2>/dev/null | tail -3 || echo "  (无)"
          done

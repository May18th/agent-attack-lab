name: 平台调用现场取证

# 只读取证：平台（梧桐）调用三个智能体失败时，nginx / 后端到底收到了什么。
# 不修改任何生产状态，跑完即删。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grab:
    runs-on: [self-hosted, production]
    timeout-minutes: 8
    steps:
      - name: 取证
        shell: bash
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          echo "===== 1. nginx 日志路径 ====="
          sudo -n nginx -T 2>/dev/null | grep -E "^\s*(access_log|error_log)" | head -10 || echo "(读不到 nginx -T)"

          echo
          echo "===== 2. mTLS server block 关键指令 ====="
          sudo -n nginx -T 2>/dev/null | grep -E "server_name|ssl_client_certificate|ssl_verify_client|proxy_set_header X-API-Key|return 40[13]|proxy_pass" | head -40 || true

          echo
          echo "===== 3. access.log 最近的 /rpc 请求（含平台 IP/状态码） ====="
          for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
            [ -r "$f" ] || continue
            echo "-- $f --"
            sudo -n tail -n 6000 "$f" 2>/dev/null | grep "/rpc" | tail -25 || echo "  (无 /rpc 记录)"
          done

          echo
          echo "===== 4. /rpc 状态码分布（最近 6000 行） ====="
          sudo -n tail -n 6000 /var/log/nginx/access.log 2>/dev/null | grep "/rpc" | awk '{print $9}' | sort | uniq -c || echo "(无)"

          echo
          echo "===== 5. nginx error.log 最近 40 行（mTLS/SSL 报错） ====="
          sudo -n tail -n 200 /var/log/nginx/error.log 2>/dev/null | tail -40 || echo "(读不到 error.log)"

          echo
          echo "===== 6. 三个后端最近 60 分钟告警/异常 ====="
          journalctl --user -u agent-attack-lab-api -u agent-attack-lab-attacker -u agent-attack-lab-defender \
            --since "-60min" --no-pager 2>/dev/null \
            | grep -iE " 40[0-9] | 50[0-9] |error|traceback|unauthorized|forbidden|identity|aic" | tail -40 \
            || echo "(无相关日志)"

          echo
          echo "===== 7. 当前生效的 AIC（各服务实际值） ====="
          for port in 8787 8788 8789; do
            pid=$(ss -lntp 2>/dev/null | grep ":$port " | grep -oP 'pid=\K[0-9]+' | head -1)
            echo "-- 127.0.0.1:$port pid=$pid --"
            if [ -n "${pid:-}" ]; then
              tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null \
                | grep -E '^AGENT_(AMP_AIC|AIP_LEADER_ID|LOCAL_AIC|IDENTITY_BINDING_ENABLED)=' || echo "  (无 AIC/绑定相关变量)"
            fi
          done

name: 开通 8443 mTLS 入口

# 阿里云备案拦截设备通常只挂在 80/443，8443 可作为 mTLS 备用入口。
# 本工作流给现有三个 server block 各加一条 listen 8443 ssl，改动前备份、nginx -t 失败自动回滚。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port:
    runs-on: [self-hosted, production]
    timeout-minutes: 8
    steps:
      - name: 加 8443 监听
        shell: bash
        run: |
          set -uo pipefail
          CONF=/etc/nginx/sites-available/agent-attack-lab-mtls.conf
          [ -r "$CONF" ] || CONF=$(sudo -n grep -l "attack.yuanyiagentzhandui.cn" /etc/nginx/sites-enabled/*.conf | head -1)
          echo "配置文件: $CONF"
          BAK="/tmp/mtls-conf-$(date +%s).bak"
          sudo -n cp "$CONF" "$BAK"
          echo "备份: $BAK"

          echo
          echo "===== 改动前的 listen 指令 ====="
          sudo -n grep -nE "^\s*listen " "$CONF"

          # 幂等：已有 8443 就跳过
          if sudo -n grep -q "listen 8443" "$CONF"; then
            echo "已存在 8443 监听，跳过修改"
          else
            sudo -n sed -i 's/^\([[:space:]]*\)listen 443 ssl;/\1listen 443 ssl;\n\1listen 8443 ssl;/' "$CONF"
            echo "注入完成，共 $(sudo -n grep -c 'listen 8443' "$CONF") 处"
          fi

          echo
          echo "===== 改动后的 listen 指令 ====="
          sudo -n grep -nE "listen (443|8443)" "$CONF"

          echo
          echo "===== nginx -t ====="
          if sudo -n nginx -t 2>&1 | tail -3; then
            sudo -n systemctl reload nginx && echo "已 reload"
          else
            echo "配置有误，回滚"
            sudo -n cp "$BAK" "$CONF"
            sudo -n nginx -t 2>&1 | tail -2
            exit 1
          fi

      - name: 验证
        shell: bash
        run: |
          set -uo pipefail
          echo "===== 监听端口 ====="
          ss -lntp 2>/dev/null | grep -E ":443|:8443" || true

          echo
          echo "===== 本机回环 8443（无客户端证书，SRV SNI 用 --resolve） ====="
          for h in attack defense leader-mtls; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 \
              --resolve "$h.yuanyiagentzhandui.cn:8443:127.0.0.1" \
              "https://$h.yuanyiagentzhandui.cn:8443/health" || echo ERR)
            echo "  $h:8443/health -> $code"
          done

          echo
          echo "===== 8443 上的证书 ====="
          echo | timeout 8 openssl s_client -connect 127.0.0.1:8443 \
            -servername attack.yuanyiagentzhandui.cn 2>/dev/null \
            | openssl x509 -noout -subject -dates 2>/dev/null || echo "  (取证书失败)"

name: 采集 RPC 访问日志

# 只读采集：清点 nginx 访问日志（含轮转的 .gz），统计 /rpc 调用来源、时间与状态。
# 目的：判断平台侧（梧桐 AIP）是否真的调用过本项目三只智能体，以及调用量。
# 不写任何文件、不 reload、不打印密钥。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: 访问日志统计
    runs-on: [self-hosted, production]
    timeout-minutes: 10
    steps:
      - name: 日志文件清点
        shell: bash
        run: |
          set -uo pipefail
          sudo -n ls -la /var/log/nginx 2>/dev/null | head -40 || echo "NO_LOG_DIR"

      - name: /rpc 总量与状态码（全部含轮转）
        shell: bash
        run: |
          set -uo pipefail
          total=0
          for f in /var/log/nginx/access.log*; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.gz ]]; then rd="zcat"; else rd="cat"; fi
            line=$(sudo -n sh -c "$rd '$f' | awk 'index(\$0,\" /rpc\")>0 {n++; st[\$9]++} END {printf \"%d\", n; for (s in st) printf \" [%s:%d]\", s, st[s]}'" 2>/dev/null)
            echo "$(basename "$f"): ${line:-EMPTY}"
          done

      - name: /rpc 按日统计
        shell: bash
        run: |
          set -uo pipefail
          for f in /var/log/nginx/access.log*; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.gz ]]; then rd="zcat"; else rd="cat"; fi
            echo "--- $(basename "$f")"
            sudo -n sh -c "$rd '$f' | awk 'index(\$0,\" /rpc\")>0 {split(\$4,d,\":\"); c[d[1]]++} END {for (k in c) print \"  \", k, c[k]}'" 2>/dev/null | sort -k2 || true
          done

      - name: /rpc 来源（IP + UA）
        shell: bash
        run: |
          set -uo pipefail
          for f in /var/log/nginx/access.log*; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.gz ]]; then rd="zcat"; else rd="cat"; fi
            echo "--- $(basename "$f")"
            sudo -n sh -c "$rd '$f' | awk 'index(\$0,\" /rpc\")>0 {ua=\"\"; for(i=12;i<=NF;i++) ua=ua\" \"\$i; c[\$1\" |\"ua\" | \"\$9]++} END {for (k in c) print \"  \", k, c[k]}'" 2>/dev/null | sort -k3 -nr | head -12 || true
          done

      - name: /rpc 样本（每日首尾）
        shell: bash
        run: |
          set -uo pipefail
          for f in /var/log/nginx/access.log*; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.gz ]]; then rd="zcat"; else rd="cat"; fi
            echo "--- $(basename "$f")"
            sudo -n sh -c "$rd '$f' | grep ' /rpc' | head -2" 2>/dev/null || true
            sudo -n sh -c "$rd '$f' | grep ' /rpc' | tail -2" 2>/dev/null || true
          done

      - name: 全部请求按日与路径 TOP
        shell: bash
        run: |
          set -uo pipefail
          for f in /var/log/nginx/access.log*; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.gz ]]; then rd="zcat"; else rd="cat"; fi
            echo "--- $(basename "$f") 每日请求数"
            sudo -n sh -c "$rd '$f' | awk '{split(\$4,d,\":\"); c[d[1]]++} END {for (k in c) print \"  \", k, c[k]}'" 2>/dev/null | sort -k2 || true
          done

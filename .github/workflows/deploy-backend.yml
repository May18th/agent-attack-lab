name: 生产后端部署

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "要部署的已审核分支或提交所在分支"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署生产后端
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 30
    steps:
      - name: 检查部署 Runner
        shell: bash
        run: |
          set -euo pipefail
          runner_user=$(id -un)
          printf 'runner_user=%s\n' "$runner_user"
          [[ "$runner_user" == deployer ]] || { echo 'Runner must run as deployer' >&2; exit 1; }
          if ! command -v uv >/dev/null 2>&1 && [[ -x /home/deployer/.local/bin/uv ]]; then
            export PATH="/home/deployer/.local/bin:$PATH"
          fi
          for command_name in git uv systemctl curl; do
            command_path=$(command -v "$command_name" || true)
            [[ -n "$command_path" ]] || { echo "Missing command: $command_name" >&2; exit 1; }
            printf '%s=%s\n' "$command_name" "$command_path"
          done

      - name: Checkout 部署提交
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref || github.ref_name }}
          fetch-depth: 1

      - name: 固定部署提交
        shell: bash
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 部署、迁移并验收
        shell: bash
        env:
          DEPLOY_REPO_DIR: /opt/agent-attack-lab
          DEPLOY_REF: ${{ inputs.deploy_ref || github.ref_name }}
          PUBLIC_HEALTH_URL: https://api.yuanyiagentzhandui.cn/health
        run: bash backend/scripts/deploy-production.sh

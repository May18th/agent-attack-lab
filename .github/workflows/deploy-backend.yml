name: 生产后端部署

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "要部署的已审核分支或提交所在分支"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署生产后端
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    steps:
      - name: 检查部署 Runner
        shell: bash
        run: |
          set -euo pipefail
          runner_user=$(id -un)
          printf 'runner_user=%s\n' "$runner_user"
          [[ "$runner_user" == deployer ]] || { echo 'Runner must run as deployer' >&2; exit 1; }
          for command_name in git systemctl curl tar python3; do
            command_path=$(command -v "$command_name" || true)
            [[ -n "$command_path" ]] || { echo "Missing command: $command_name" >&2; exit 1; }
            printf '%s=%s\n' "$command_name" "$command_path"
          done

      - name: 下载部署源码
        shell: bash
        env:
          DEPLOY_REF_INPUT: ${{ inputs.deploy_ref || github.sha }}
        run: |
          set -euo pipefail
          requested_ref="$DEPLOY_REF_INPUT"
          if [[ "$requested_ref" =~ ^[0-9a-f]{40}$ ]]; then
            deploy_sha="$requested_ref"
          else
            deploy_sha=$(curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${requested_ref}" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')
          fi
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Could not resolve a full deployment SHA' >&2; exit 1; }

          source_dir="$RUNNER_TEMP/agent-attack-lab-source"
          archive_path="$RUNNER_TEMP/agent-attack-lab-source.tar.gz"
          rm -rf "$source_dir" "$archive_path"
          mkdir -p "$source_dir"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 120 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${deploy_sha}" \
            --output "$archive_path"
          tar -xzf "$archive_path" --strip-components=1 --directory "$source_dir"
          [[ -f "$source_dir/backend/scripts/deploy-production.sh" ]] || { echo 'Downloaded source is missing deploy script' >&2; exit 1; }

          printf 'DEPLOY_REF=%s\n' "$requested_ref" >> "$GITHUB_ENV"
          printf 'DEPLOY_SHA=%s\n' "$deploy_sha" >> "$GITHUB_ENV"
          printf 'DEPLOY_SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"

      - name: 固定部署提交
        shell: bash
        run: |
          printf 'Using deployment SHA: %s\n' "$DEPLOY_SHA"

      - name: 注入模型与心跳配置
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.AGENT_LLM_API_KEY }}
        run: |
          set -euo pipefail
          env_file=/opt/agent-attack-lab/backend/.env
          if [[ ! -f "$env_file" ]]; then
            echo "missing $env_file" >&2
            exit 1
          fi
          if [[ -z "${LLM_API_KEY:-}" ]]; then
            echo "AGENT_LLM_API_KEY secret is empty; skip model injection"
            exit 0
          fi
          upsert() {
            local key=$1 value=$2 tmp found=0
            tmp=$(mktemp)
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^[[:space:]]*${key}= ]]; then
                printf '%s=%s\n' "$key" "$value"
                found=1
              else
                printf '%s\n' "$line"
              fi
            done < "$env_file" > "$tmp"
            if (( found == 0 )); then
              printf '%s=%s\n' "$key" "$value" >> "$tmp"
            fi
            cat "$tmp" > "$env_file"
            rm -f "$tmp"
          }
          upsert AGENT_LLM_BASE_URL "https://api.deepseek.com/v1"
          upsert AGENT_LLM_MODEL "deepseek-chat"
          upsert AGENT_LLM_API_KEY "$LLM_API_KEY"
          upsert AGENT_ARBITER_LLM_ENABLED "1"
          upsert AGENT_REPORT_LLM_ENABLED "1"
          upsert AGENT_RULE_DISCOVERY_LLM_ENABLED "1"
          upsert AGENT_AMP_ENABLED "1"
          printf 'injected model and AMP settings into %s\n' "$env_file"

      - name: 部署、迁移并验收
        shell: bash
        env:
          DEPLOY_REPO_DIR: /opt/agent-attack-lab
          PUBLIC_HEALTH_URL: https://api.yuanyiagentzhandui.cn/health
        run: bash "$DEPLOY_SOURCE_DIR/backend/scripts/deploy-production.sh"

name: 补主调度 Kafka 依赖

# 主调度(8787)若缺 kafka-python，AMP 心跳只写本地 NDJSON，平台侧判离线。
# 本工作流：定位 venv → 检查 kafka → 缺失则安装 → 重启 api → 验证。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: [self-hosted, production]
    timeout-minutes: 12
    steps:
      - name: 定位 venv 并检查
        shell: bash
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          echo "===== api 服务的 ExecStart ====="
          systemctl --user show -p ExecStart --value agent-attack-lab-api || true

          echo
          echo "===== attacker 服务的 ExecStart（对照） ====="
          systemctl --user show -p ExecStart --value agent-attack-lab-attacker || true

          api_venv=$(systemctl --user show -p ExecStart --value agent-attack-lab-api \
            | grep -oE '/[^ ]*\.venv' | head -1)
          atk_venv=$(systemctl --user show -p ExecStart --value agent-attack-lab-attacker \
            | grep -oE '/[^ ]*\.venv' | head -1)
          echo
          echo "api_venv=$api_venv"
          echo "atk_venv=$atk_venv"

          echo
          echo "===== 各自是否装了 kafka ====="
          for v in "$api_venv" "$atk_venv"; do
            [ -n "$v" ] || continue
            printf '%-90s ' "$v"
            "$v/bin/python" -c "import kafka,kafka.version;print('kafka', kafka.version.__version__)" 2>/dev/null || echo "MISSING"
          done

      - name: 缺失则安装 kafka-python
        shell: bash
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          api_venv=$(systemctl --user show -p ExecStart --value agent-attack-lab-api \
            | grep -oE '/[^ ]*\.venv' | head -1)
          [ -n "$api_venv" ] || { echo "拿不到 api venv，退出"; exit 1; }

          if "$api_venv/bin/python" -c "import kafka" 2>/dev/null; then
            echo "已安装，跳过"
            exit 0
          fi

          echo "安装到 $api_venv"
          if "$api_venv/bin/python" -m pip install --no-input "kafka-python>=3.0" 2>&1 | tail -5; then
            echo "pip 安装返回 0"
          else
            echo "pip 失败，回退 uv pip"
            command -v uv >/dev/null && uv pip install --python "$api_venv/bin/python" "kafka-python>=3.0" 2>&1 | tail -5 \
              || echo "uv 也不可用"
          fi

          echo "校验："
          "$api_venv/bin/python" -c "import kafka,kafka.version;print('kafka', kafka.version.__version__)"

      - name: 重启主调度并验证心跳投递
        shell: bash
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          systemctl --user restart agent-attack-lab-api
          sleep 12

          echo "===== 单元状态 ====="
          systemctl --user is-active agent-attack-lab-api

          echo
          echo "===== 启动后 AMP 相关日志 ====="
          journalctl --user -u agent-attack-lab-api --since "-1min" --no-pager 2>/dev/null \
            | grep -iE "amp|kafka|心跳|aic|error|traceback" | tail -20 || echo "(无)"

          echo
          echo "===== 本地心跳文件仍在更新？ ====="
          tail -1 /opt/agent-attack-lab/backend/.data/amp/amp_heartbeat_leader.jsonl 2>/dev/null | cut -c1-180 || echo "(读不到)"

          echo
          echo "===== 健康检查 ====="
          curl -s -o /dev/null -w '127.0.0.1:8787/health -> %{http_code}\n' --max-time 8 http://127.0.0.1:8787/health
          curl -s -o /dev/null -w 'api 公网 /health -> %{http_code}\n' --max-time 15 https://api.yuanyiagentzhandui.cn/health

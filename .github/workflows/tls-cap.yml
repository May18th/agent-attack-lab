name: 抓 443 握手与 RST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cap:
    runs-on: [self-hosted, production]
    timeout-minutes: 8
    steps:
      - name: 抓包 70 秒并分析
        shell: bash
        run: |
          set -uo pipefail
          CAP=/tmp/tls-cap-$$.pcap
          echo "CAP_FILE=$CAP"
          sudo -n nohup timeout 70 tcpdump -i any -n -s 0 -w "$CAP" \
            'tcp port 443 and (tcp[tcpflags] & (tcp-syn|tcp-rst|tcp-fin) != 0 or tcp port 443)' \
            >/dev/null 2>&1 &
          sleep 3
          echo "STARTED $(date '+%H:%M:%S')  —— 现在开始从客户端发起请求"
          sleep 62
          echo
          echo "===== 抓到的包里，非本机出站的记录（最多 40 条） ====="
          sudo -n tcpdump -r "$CAP" -n 2>/dev/null | grep -vE "172\.20\.12\.203\.\d+ > " | head -40 || echo "  (无)"

          echo
          echo "===== RST 包来源统计 ====="
          sudo -n tcpdump -r "$CAP" -n 'tcp[tcpflags] & tcp-rst != 0' 2>/dev/null | awk '{print $3}' | sort | uniq -c | head -10 || echo "  (无 RST)"

          echo
          echo "===== 是否有 ClientHello 到达（长度 > 200 的入站包） ====="
          sudo -n tcpdump -r "$CAP" -n 'tcp and (tcp[tcpflags] & tcp-push != 0)' 2>/dev/null | grep -v "172.20.12.203" | head -15 || echo "  (无入站数据包)"

          echo
          echo "===== 全量条数 ====="
          sudo -n tcpdump -r "$CAP" -n 2>/dev/null | wc -l
          sudo -n rm -f "$CAP"

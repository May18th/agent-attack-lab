<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
  <title>智能体攻防实验室 · 系统架构</title>
  <desc>梧桐平台负责 ACS 注册与 Discovery 发现、AMP 心跳存活判定与 AIP 调用；生产环境经 Cloudflare Tunnel 暴露 Leader 8787、攻击 8788、防守 8789 三个常驻服务，三者以 AIP JSON-RPC 2.0 与 mTLS 互联，每次调用带 correlationId；四路模型分别负责攻击生成、防守检测、仲裁裁决与战报摘要，任一路失败退回确定性规则。</desc>

